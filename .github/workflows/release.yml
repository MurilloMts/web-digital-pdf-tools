# Publica uma nova versão no GitHub Releases sempre que uma tag "v*" é enviada
# (ex.: v1.0.3). Usa o token interno do repositório — nenhum token pessoal é necessário.
#
# Para lançar: aumente "version" no package.json, faça o commit e envie a tag:
#   git tag v1.0.3 && git push origin main v1.0.3

name: Release

on:
  push:
    tags: ['v*']
  # Botão "Run workflow" na aba Actions (escolha a tag da versão em "Use workflow from")
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # A tag precisa bater com o package.json, senão os apps instalados não detectam a atualização
      - name: Conferir versão
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "A tag ${{ github.ref_name }} não bate com a versão $version do package.json"
            exit 1
          }

      - run: npm ci

      - name: Gerar e publicar
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
